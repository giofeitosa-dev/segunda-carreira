spring.application.name=ageblind-api

server.port=8080

# --- JPA / H2 (demo) ---
# DB_CLOSE_DELAY=-1: o banco em memória sobrevive à queda de todas as
# conexões (ex.: aposentadorio em massa do Hikari após sleep do PC).
spring.datasource.url=jdbc:h2:mem:ageblind;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Flyway database migration ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public

# --- SpringDoc (Swagger) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorting=alpha
springdoc.packages-to-scan=com.reconecta.ageblind

# --- Atuação ---
management.endpoints.web.exposure.include=health,info

# --- Vagas externas (Adzuna) ---
adzuna.app-id=${ADZUNA_APP_ID:}
adzuna.app-key=${ADZUNA_APP_KEY:}
adzuna.pais=br

# --- JWT (HS256) — ciclo 001-jwt-security-baseline ---
# Em prod a env JWT_SECRET é OBRIGATÓRIA (≥32 chars, sem default) — JwtConfig fail-fast.
# Default abaixo é só para dev/teste (está em SECRETS_PROIBIDOS, rejeitado em prod).
app.jwt.secret=ageblind-demo-secret-key-2026-001
app.jwt.expiration=${JWT_EXPIRATION:1800000}

# --- CORS (allowlist explícita; ver CorsConfig no C1.6) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Rate limit /auth (filtro in-memory; ver RateLimitFilter no C1.6) ---
app.ratelimit.auth.limite=${AUTH_RATE_LIMIT:10}
app.ratelimit.auth.janela-segundos=${AUTH_RATE_WINDOW:60}

# --- Upload de curriculo (PDF/DOCX/TXT) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
