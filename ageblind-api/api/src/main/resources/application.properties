spring.application.name=ageblind-api

server.port=8080

# --- JPA / H2 (demo) ---
# DB_CLOSE_DELAY=-1: o banco em memória sobrevive à queda de todas as
# conexões (ex.: aposentadorio em massa do Hikari após sleep do PC).
spring.datasource.url=jdbc:h2:mem:ageblind;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- SpringDoc (Swagger) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorting=alpha
springdoc.packages-to-scan=com.reconecta.ageblind

# --- Atuação ---
management.endpoints.web.exposure.include=health,info

# --- Vagas externas (Adzuna) ---
adzuna.app-id=${ADZUNA_APP_ID:}
adzuna.app-key=${ADZUNA_APP_KEY:}
adzuna.pais=br

# --- Seguranca (HTTP Basic stateless; painel RH exige ROLE_RH) ---
app.rh.usuario=${RH_USER:rh}
app.rh.senha=${RH_PASSWORD:rh-demo}

# --- Upload de curriculo (PDF/DOCX/TXT) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
