# --- Profile PROD: PostgreSQL ---
# Credenciais/URL via env (DB_URL, DB_USER, DB_PASSWORD); os defaults apontam
# para o servico "db" do docker-compose.yml (rede interna do compose).
# ddl-auto=update porque o projeto ainda nao usa Flyway/Liquibase — em producao
# real, migracao versionada e a proxima evolucao (divida consciente).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/segunda_carreira}
spring.datasource.username=${DB_USER:reconecta}
spring.datasource.password=${DB_PASSWORD:reconecta}
spring.jpa.hibernate.ddl-auto=update

# H2 so existe no profile demo (padrao sem profile) e nos testes
spring.h2.console.enabled=false
