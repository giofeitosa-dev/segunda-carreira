name: CI

on:
  push:
    branches: [main, feat/ageblind-api]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ageblind-api/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes e build
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

  front:
    name: Front (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ageblind-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ageblind-front/package-lock.json
      - name: Dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes de componente (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright + compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sobe stack (db + api + front)
        run: docker compose up -d --build
      - name: Aguarda saúde do stack
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1 && \
            curl -fsS http://localhost:3000 >/dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS http://localhost:8080/actuator/health
          curl -fsS -o /dev/null -w 'front %{http_code}\n' http://localhost:3000
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ageblind-front/package-lock.json
      - name: Dependências
        run: npm ci
        working-directory: ageblind-front
      - name: Instala Chromium do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: ageblind-front
      - name: Testes E2E
        run: npm run e2e
        working-directory: ageblind-front
      - name: Logs do stack (falha)
        if: failure()
        run: docker compose logs --no-color | tail -n 300
      - name: Artefatos do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ageblind-front/playwright-report
            ageblind-front/test-results
          retention-days: 7

  docker:
    name: Docker (imagem da API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Valida docker-compose
        run: docker compose config -q
      - name: Build da imagem da API
        run: docker build -t ageblind-api:ci ./ageblind-api/api
      - name: Build da imagem do front
        run: docker build -t ageblind-front:ci ./ageblind-front
