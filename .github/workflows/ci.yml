name: CI

on:
  push:
    branches: [main, feat/ageblind-api]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ageblind-api/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes e build
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

  front:
    name: Front (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ageblind-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ageblind-front/package-lock.json
      - name: Dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
