version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/ageblind-api/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"

  - package-ecosystem: "npm"
    directory: "/ageblind-front"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
