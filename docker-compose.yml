# Segunda Carreira / AgeBlind — front + API + PostgreSQL
# Uso: docker compose up -d --build  (front em http://localhost:3000, API em :8080)
# Dados demo via profile "seed" (default); sem seed: SPRING_PROFILES_ACTIVE=prod
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-segunda_carreira}
      POSTGRES_USER: ${POSTGRES_USER:-reconecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reconecta}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./ageblind-api/api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,seed}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-segunda_carreira}
      DB_USER: ${POSTGRES_USER:-reconecta}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-reconecta}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      RH_USER: ${RH_USER:-rh}
      RH_PASSWORD: ${RH_PASSWORD:-rh-demo}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  front:
    build: ./ageblind-front
    ports:
      - "${FRONT_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  pgdata:
